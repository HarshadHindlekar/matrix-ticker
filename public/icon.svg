<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#07070a" />
    </linearGradient>
    <!-- Frame Border -->
    <linearGradient id="bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b3b48" />
      <stop offset="50%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <!-- LED Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Bezel -->
  <rect x="16" y="16" width="480" height="480" rx="48" fill="url(#bezel)" stroke="#555566" stroke-width="4" />
  
  <!-- Screws in corners -->
  <circle cx="48" cy="48" r="8" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="464" cy="48" r="8" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="48" cy="464" r="8" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="464" cy="464" r="8" fill="#444" stroke="#222" stroke-width="2"/>

  <!-- Screen Area -->
  <rect x="44" y="80" width="424" height="352" rx="16" fill="url(#bg)" stroke="#111" stroke-width="6" />

  <!-- LED Grid Background Pattern -->
  <g opacity="0.15">
    <pattern id="dotPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="#ffffff" />
    </pattern>
    <rect x="44" y="80" width="424" height="352" rx="16" fill="url(#dotPattern)" />
  </g>

  <!-- Glowing LED Ticker Graphic -->
  <g filter="url(#glow)">
    <!-- Simulated LED Text 'LED' -->
    <path d="M 90 180 L 90 320 L 170 320 L 170 290 L 125 290 L 125 180 Z" fill="#ff9900" />
    <path d="M 195 180 L 195 320 L 275 320 L 275 290 L 230 290 L 230 265 L 265 265 L 265 235 L 230 235 L 230 210 L 275 210 L 275 180 Z" fill="#ff9900" />
    <path d="M 300 180 L 300 320 L 360 320 C 400 320 420 290 420 250 C 420 210 400 180 360 180 Z M 335 210 L 360 210 C 375 210 385 225 385 250 C 385 275 375 290 360 290 L 335 290 Z" fill="#ff9900" />

    <!-- Animated scrolling dots / signal indicator -->
    <circle cx="100" cy="130" r="8" fill="#00ff66" />
    <circle cx="130" cy="130" r="8" fill="#00ff66" />
    <circle cx="160" cy="130" r="8" fill="#00ff66" />
    <circle cx="190" cy="130" r="8" fill="#00ff66" opacity="0.3" />

    <!-- Arrow icon -->
    <path d="M 380 130 L 415 130 M 405 120 L 415 130 L 405 140" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Glass Highlight Reflection -->
  <path d="M 46 82 L 320 82 L 46 360 Z" fill="white" opacity="0.04" />
</svg>
